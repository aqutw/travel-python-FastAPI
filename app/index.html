<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>留白旅行 · API Explorer</title>
<style>
:root{color-scheme:light;font-family:ui-sans-serif,system-ui,sans-serif;color:#203a32;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:48px 28px}header{display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #cdd8cd;padding-bottom:26px}h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.05em;font-weight:500;margin:30px 0 12px}p{line-height:1.8;color:#53665b}a{color:#256454}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a86528;outline-offset:3px}.eyebrow{letter-spacing:.16em;font-size:12px}.tag{border:1px solid #91aa9c;border-radius:30px;padding:8px 14px;font-size:12px;white-space:nowrap}form{display:grid;grid-template-columns:1fr auto;gap:12px;margin:28px 0 14px}label{grid-column:1/-1;font-size:14px}select,input,button{font:inherit;border:1px solid #a7b8ad;border-radius:5px;padding:14px;background:white;color:inherit}select{width:100%;margin:20px 0 0}button{background:#254f42;color:#fff;cursor:pointer}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-top:24px}pre{margin:0;padding:24px;background:#172d26;color:#dce9da;overflow:auto;max-height:640px;font:13px/1.65 ui-monospace,monospace;border-radius:6px}figure{margin:0}img{display:block;width:100%;border-radius:6px}figcaption{font-size:13px;line-height:1.7;margin:12px 0;color:#53665b}#status{min-height:24px;font-size:14px}footer{margin-top:32px;border-top:1px solid #cdd8cd;padding-top:20px;font-size:13px}@media(max-width:720px){.workspace{grid-template-columns:1fr}figure{display:none}form{grid-template-columns:1fr}header{align-items:start}main{padding:24px 18px}button{min-height:48px}}
</style>
<main>
<header><span class="eyebrow">TRAVEL / DEVELOPER EDITION</span><span class="tag">GET ONLY · MOCK DATA</span></header>
<h1>把畫面，接上旅行。</h1><p>96 筆虛構商品、8 種旅遊品類。從首頁靈感、目的地搜尋，到房型、艙房與日期方案，讓前端開發有資料可用。</p>
<a href="/openapi.json">下載 OpenAPI 3.0 契約</a>
<label for="presets" style="display:block;margin-top:28px">選擇範例</label>
<select id="presets"><option value="/api/v1/home">首頁聚合</option><option value="/api/v1/products?type=stay&sort=price_asc">住宿搜尋與篩選</option><option value="/api/v1/search/suggestions?q=東京">目的地自動完成</option><option value="/api/v1/products/cruise-001">郵輪詳情</option><option value="/api/v1/products/stay-001/rooms">住宿房型</option><option value="/api/v1/products/cruise-001/cabins">郵輪艙房</option><option value="/api/v1/products/tour-001/departures">跟團出發日期</option><option value="/api/v1/products/stay-001/availability">住宿庫存與報價</option><option value="/api/v1/collections/camping/products">露營與包棟</option><option value="/api/v1/products?type=unknown">錯誤回應範例</option></select>
<form id="query"><label for="path">GET 路徑（僅限本站 /api/v1/）</label><input id="path" value="/api/v1/home" spellcheck="false" required><button type="submit">送出請求 ↗</button></form>
<div id="status" role="status" aria-live="polite">選擇範例後送出請求。</div>
<div class="workspace"><pre id="output" tabindex="0" aria-label="JSON 回應">{ "ready": true }</pre><figure><img src="/images/cruise.svg" alt="以幾何圖形繪製的郵輪示意插畫" width="1200" height="800"><figcaption>所有文字、品牌、評價、價格、庫存與插畫均為原創測試資料。本專案依公開網站資訊架構設計，未連接真實訂單系統。</figcaption></figure></div>
<footer>預設 zh-TW / TWD · 圖片使用本站相對路徑 · 支援 CORS · 無需 API key</footer>
</main>
<script>
const path=document.getElementById('path'), status=document.getElementById('status'), output=document.getElementById('output');
document.getElementById('presets').addEventListener('change', e=>{path.value=e.target.value});
document.getElementById('query').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;try{const url=new URL(path.value,location.origin);if(url.origin!==location.origin||!url.pathname.startsWith('/api/v1/'))throw new Error('請輸入本站 /api/v1/ 路徑。');button.disabled=true;status.textContent='正在讀取…';const start=performance.now(),response=await fetch(url);const body=await response.json();output.textContent=JSON.stringify(body,null,2);status.textContent=`HTTP ${response.status} · ${Math.round(performance.now()-start)} ms · ${new TextEncoder().encode(JSON.stringify(body)).length.toLocaleString()} bytes`;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script>
</html>
