name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make test
      - name: Verify generated artifacts are reproducible
        run: |
          make generate
          git diff --exit-code
      - name: Verify README links and all API examples
        run: make verify-examples
      - name: Validate the running API and OpenAPI contract
        run: |
          export API_WRITE_KEY=ci-test-key-at-least-32-bytes-000000
          cp data/travel.sqlite3 /tmp/travel-ci.sqlite3
          DB_PATH=/tmp/travel-ci.sqlite3 REFERENCE_DATE=2026-10-20 python -m uvicorn app.main:app --port 8000 --no-proxy-headers --no-access-log > /tmp/travel-python-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          make verify verify-writes
      - name: Verify Docker build and persistent writes
        env:
          API_WRITE_KEY: ci-test-key-at-least-32-bytes-000000
        run: |
          docker build -t travel-python-fastapi .
          docker volume create travel-ci-data
          trap 'docker rm -f travel-ci; docker volume rm travel-ci-data' EXIT
          docker run -d --name travel-ci --read-only -p 8005:8000 \
            -e API_WRITE_KEY -e REFERENCE_DATE=2026-10-20 \
            --mount type=volume,source=travel-ci-data,target=/app/data travel-python-fastapi
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8005/healthz > /dev/null; then break; fi
            sleep 1
          done
          python scripts/verify_api.py --base-url http://localhost:8005
          python scripts/verify_writes.py --base-url http://localhost:8005
          docker restart travel-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8005/healthz > /dev/null; then break; fi
            sleep 1
          done
          python - <<'PYCODE'
          import json, os, urllib.request
          request = urllib.request.Request('http://localhost:8005/api/v1/wishlists', headers={'X-API-Key': os.environ['API_WRITE_KEY']})
          with urllib.request.urlopen(request) as response:
              body = json.load(response)
          assert len(body['data']) == 1 and body['data'][0]['version'] == 2, body
          print('Docker restart preserved SQLite writes.')
          PYCODE
